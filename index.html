<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Esme 💗</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ffb8cb}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:manipulation}</style></head>
<body><canvas id="screen"></canvas><script>
const cv=document.querySelector('#screen'),ctx=cv.getContext('2d'),c=document.createElement('canvas'),g=c.getContext('2d');c.width=320;c.height=240;
let mode='intro',tick=0,portal=0,light=false,lightTarget=false,lightAnim=0,broken=false,uses=0,ambient=.025,ambientTarget=.025,ambientWait=80,fan=0,flash=false;
const stars=Array.from({length:65},()=>({x:Math.random()*320,y:Math.random()*240,v:.15+Math.random()*.3}));
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}addEventListener('resize',fit);fit();
function R(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}
function T(s,x,y,size=8,col='#fff'){g.fillStyle=col;g.font=size+'px monospace';g.textAlign='center';g.fillText(s,x,y)}
function border(x,y,w,h,col){R(x,y,w,1,col);R(x,y+h-1,w,1,col);R(x,y,1,h,col);R(x+w-1,y,1,h,col)}
function foxy(x,y,s=1){
 const red='#cf202e',dark='#8e1422',black='#202126',gold='#e3b62e',skin='#f0a968';
 // Silueta pixelada inspirada en la referencia enviada
 const blocks=[[0,0,5,5],[19,0,5,5],[2,3,5,6],[17,3,5,6],[6,5,12,8],[8,2,2,3],[14,2,2,3],[9,10,6,7],[5,13,14,5],[3,16,18,3],[5,19,14,3],[8,21,8,3]];
 blocks.forEach(([a,b,w,h])=>R(x+(a-12)*s,y+(b-12)*s,w*s,h*s,red));
 R(x-9*s,y-8*s,5*s,5*s,dark);R(x+4*s,y-8*s,5*s,5*s,dark);
 R(x-3*s,y-5*s,3*s,2*s,dark);R(x+3*s,y-5*s,3*s,2*s,dark);
 R(x-3*s,y+2*s,7*s,5*s,skin);R(x-1*s,y+1*s,3*s,2*s,gold);
 R(x-2*s,y+6*s,2*s,2*s,gold);R(x+3*s,y+6*s,2*s,2*s,gold);
 R(x-2*s,y+4*s,5*s,1*s,black);
 R(x-11*s,y-10*s,2*s,2*s,red);R(x+9*s,y-10*s,2*s,2*s,red);
}
function intro(){
 R(0,0,320,240,'#ffb8cb');
 stars.forEach(a=>{a.y-=a.v;if(a.y<0){a.y=240;a.x=Math.random()*320}R(a.x,a.y,2,2,'#fff4f7')});
 const x=160+Math.sin(tick*.025)*3,y=116+Math.sin(tick*.04)*2;
 R(x-36,y-25,72,54,'#a94b6b');R(x-34,y-28,68,54,'#fff0f4');border(x-34,y-28,68,54,'#a94b6b');
 R(x-34,y-28,68,4,'#f6c7d4');T('♥',x,y+9,24,'#ec547c');T('TOCÁ LA CARTA',160,184,9,'#9d3e60');
 if(mode==='portal'){portal++;g.save();g.translate(160,116);g.rotate(portal*.08);g.scale(1+portal*.04,1+portal*.04);R(-40,-30,80,60,'#fff0f4');g.restore();R(0,0,320,240,'rgba(20,8,20,'+Math.min(.98,portal/45)+')');if(portal>48){mode='office';portal=0}}
}
function windowSide(x){R(x-2,49,36,49,'#111018');R(x+2,53,28,41,'#202a36');R(x+5,56,3,34,'#39434d');R(x+19,56,2,34,'#39434d');R(x+2,73,28,2,'#59616a');border(x-2,49,36,49,'#a99b9c')}
function door(x){R(x-3,42,40,88,'#0b0b10');R(x,45,34,82,'#50434a');R(x+4,49,26,74,'#17151b');R(x+8,55,18,19,'#373039');R(x+8,81,18,19,'#373039');R(x+5,116,24,5,'#8b7c81')}
function desk(){
 R(94,182,132,8,'#17131a');R(99,175,122,8,'#ad8057');R(103,183,114,31,'#684737');R(108,187,7,36,'#30232a');R(205,187,7,36,'#30232a');
 // Osito Foxy sobre el escritorio
 foxy(160,169,.68);
 // Ventilador con base apoyada en la mesa y aspas giratorias
 R(204,175,22,3,'#29242b');R(213,164,4,12,'#77717a');R(207,161,16,3,'#45434b');
 g.save();g.translate(215,158);g.rotate(fan);for(let i=0;i<4;i++){g.rotate(Math.PI/2);R(-2,-12,4,10,'#b9bbc0')}R(-3,-3,6,6,'#ddd5cc');g.restore();
 R(137,159,18,13,'#17151b');R(140,156,12,4,'#5a555b');
}
function office(){
 R(0,0,320,240,'#111017');R(0,0,320,137,'#302a32');R(0,0,320,8,'#17151b');
 for(let x=12;x<320;x+=32)R(x,15,2,110,'#42343b');
 door(5);door(275);windowSide(48);windowSide(236);
 R(125,35,70,56,'#101017');R(130,40,60,46,'#1a202a');R(158,40,3,46,'#61545a');border(125,35,70,56,'#a99b9c');
 R(0,132,320,4,'#08080b');for(let y=136;y<240;y+=12)for(let x=0;x<320;x+=12)R(x,y,12,12,((x/12+y/12)%2)?'#171717':'#dedede');
 desk();
 R(236,96,13,20,'#17131a');R(238,98,9,16,'#aaa09d');R(241,100,4,9,broken?'#242027':light?'#fff0a5':'#484149');
 if(broken){R(235,95,2,4,'#a33b35');R(248,108,2,4,'#a33b35')}
}
function update(){
 fan+=.15;ambientWait--;
 if(ambientWait<=0){if(ambientTarget<.08){ambientTarget=.19+Math.random()*.08;ambientWait=45+Math.random()*40}else{ambientTarget=.02+Math.random()*.025;ambientWait=80+Math.random()*100}}
 ambient+=(ambientTarget-ambient)*.1;
 if(lightAnim>0){lightAnim--;if(!lightAnim)light=lightTarget}
}
function officeFrame(){
 update();office();
 if(light){R(0,0,320,240,'rgba(255,224,174,.22)')}
 else {R(0,0,320,240,'rgba(0,0,0,'+(0.92-ambient*.65)+')');R(0,0,320,240,'rgba(190,170,145,'+(ambient*.33)+')')}
 if(lightAnim>0&&Math.floor(lightAnim/3)%2===0)R(0,0,320,240,'rgba(255,230,180,.12)');
 T(broken?'INTERRUPTOR ROTO': 'CLIC EN EL INTERRUPTOR PARA LA LUZ',160,16,7,'#c9c0c4');
}
function frame(){tick++;if(mode==='intro'||mode==='portal')intro();else officeFrame();ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(c,0,0,cv.width,cv.height);requestAnimationFrame(frame)}
function point(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*320/b.width,y:(e.clientY-b.top)*240/b.height}}
cv.addEventListener('pointerdown',e=>{
 const p=point(e);
 if(mode==='intro'){if(Math.hypot(p.x-160,p.y-116)<75){mode='portal';portal=0}return}
 if(mode!=='office')return;
 if(p.x>230&&p.x<254&&p.y>91&&p.y<122){
   if(broken||lightAnim)return;
   uses++;if(uses>=7){broken=true;light=false;lightAnim=0;return}
   lightTarget=!light;lightAnim=42;return;
 }
});
frame();
</script></body></html>
